# Regulatory claim record. See 03-governance/claims/README.md.
id: nj-lad-third-party-tool-no-defense
jurisdiction: US-NJ
topic: Deployer liability for a vendor-built automated decision-making tool
statement: Under the New Jersey Law Against Discrimination, an employer is not shielded from
  liability for algorithmic discrimination because the tool was built by a third party or
  because the employer does not understand how the tool works.
status: in-force
primary_source:
  url: https://www.nj.gov/oag/newsreleases25/2025-0108_DCR-Guidance-on-Algorithmic-Discrimination.pdf
  citation: New Jersey Office of the Attorney General and Division on Civil Rights, Guidance
    on Algorithmic Discrimination and the New Jersey Law Against Discrimination (January 2025),
    "Who Is Liable for Discrimination Under the LAD"
  quote: a covered entity is not shielded from liability for algorithmic discrimination that
    results from the entity's use of an automated decision-making tool simply because the tool
    was developed by a third party or because the entity does not understand the inner workings
    of the tool
  retrieved: '2026-09-18'
asserted_in:
- 03-governance/risk-assessment-template.md
- 04-enablement/hr-ai-literacy-curriculum.md
last_verified: never
verified_by: unverified
review_interval_days: 180
notes: 'No effective date field, for the same reason as
  nj-lad-covers-algorithmic-discrimination: the duty is the statute, not the guidance.

  The quote is deliberately clipped at both ends. It starts after "Nevertheless," and stops
  before the closing period, because a footnote marker (50) abuts the period in the source and
  extraction renders it inconsistently as "tool.50" or "tool. 50". Clipping keeps the match
  stable without changing the meaning.

  The full sentence in the source begins "Nevertheless, a covered entity is not shielded".

  A parallel sentence in Section II carries the same rule in different words and would make a
  reasonable alternative anchor if this one ever stops matching: a covered entity "is not
  immunized from liability for violating the LAD merely because its discriminatory policy or
  practice involves using or relying on an automated decision-making tool". It is not used as
  the quote here because the full sentence contains em dashes, which the repo bans, so quoting
  it in prose would require clipping around them.

  The quote was taken by PDF text extraction, not from a human reading the document, so
  last_verified stays never.'
