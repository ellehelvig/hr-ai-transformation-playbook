review_interval_days: 90
notes: 'The quote is from Section 13, at page 20 of 74 of the enrolled act, amending Conn.
  Gen. Stat. 46a-60(b)(1). Section 14 carries parallel language at page 27 of 74 for sexual
  orientation and civil union status, which is why the citation names both.

  The quote was taken from the enrolled act PDF via text extraction, not typed from a human
  reading, so last_verified stays never until someone opens the PDF and confirms it. The
  online check anchors the words; a human still owes the reading.

  The sentence that follows the quote is the operationally important half: the commission or
  court may consider evidence of anti-bias testing, including its quality, efficacy, recency
  and scope, the results, and the response to them. It is not in the quote field because that
  sentence spans a page break in the source and is better verified as its own record once
  someone has read it.

  Watch the phasing: sections 7 to 12 also take effect 1 October 2026, but the developer and
  deployer duties they create attach only to technology deployed on or after 1 October 2027.
  This record covers only the discrimination-defense change, which has no such deferral. See
  ct-pa-26-15-developer-may-assume-deployer-duties for the other half.'
