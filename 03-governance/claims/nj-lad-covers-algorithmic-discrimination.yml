# Regulatory claim record. See 03-governance/claims/README.md.
id: nj-lad-covers-algorithmic-discrimination
jurisdiction: US-NJ
topic: Algorithmic discrimination under the New Jersey Law Against Discrimination
statement: The New Jersey Law Against Discrimination applies to discrimination resulting from
  the use of automated decision-making tools, including in employment, in the same way it
  applies to other discriminatory conduct. New Jersey has no AI-specific employment statute;
  the exposure comes from the existing statute as interpreted by the Attorney General and the
  Division on Civil Rights.
status: in-force
primary_source:
  url: https://www.nj.gov/oag/newsreleases25/2025-0108_DCR-Guidance-on-Algorithmic-Discrimination.pdf
  citation: New Jersey Office of the Attorney General and Division on Civil Rights, Guidance
    on Algorithmic Discrimination and the New Jersey Law Against Discrimination (January 2025),
    Section II, interpreting N.J.S.A. 10:5-1 et seq.
  quote: The LAD applies to discrimination stemming from the use of automated decision-making
    tools in the same way it has long applied to other forms of discriminatory conduct.
  retrieved: '2026-09-18'
