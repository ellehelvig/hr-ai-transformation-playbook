# Regulatory claim record. See 03-governance/claims/README.md.
id: ct-pa-26-15-ai-not-a-defense
jurisdiction: US-CT
topic: Automated employment-related decision technology and discrimination defenses
statement: From 1 October 2026, using an automated employment-related decision technology is
  not a defense against a complaint alleging a discriminatory practice under Conn. Gen. Stat.
  46a-60, and the commission or a court may consider evidence of anti-bias testing, including
  its quality, efficacy, recency and scope, the results, and the employer's response to them.
status: enacted-not-yet-effective
effective: '2026-10-01'
primary_source:
  url: https://www.cga.ct.gov/2026/ACT/PA/PDF/2026PA-00015-R00SB-00005-PA.PDF
  citation: Connecticut Public Act 26-15 (Substitute Senate Bill No. 5), Sections 13 and 14,
    amending Conn. Gen. Stat. 46a-60(b) and 46a-81c
asserted_in:
