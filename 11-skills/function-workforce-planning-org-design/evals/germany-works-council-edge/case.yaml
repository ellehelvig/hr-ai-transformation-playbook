schema_version: "1.1"
name: germany-works-council-edge
expected_outcome: |
  A good result labels the missing skills data and the blank M4 row as gaps, notes that the listed spans already sum to 85, and asks once for the missing facts before proceeding.
  It treats spans as structural signals matched to work type rather than judgments of managers, and routes the performance-rating ticket assignment tool to counsel by pointing to the EU AI Act high-risk HR systems row in the Key dates table.
  It says the works council is consulted before the merger or the tool is decided, and makes no decision about any manager.
