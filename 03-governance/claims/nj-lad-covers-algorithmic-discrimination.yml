verified_by: unverified
review_interval_days: 180
notes: 'No effective date field. The obligation is the LAD itself, in force for decades and
  amended repeatedly since; the January 2025 document is interpretive guidance, not a new
  obligation with a commencement date. Recording a 2025 effective date here would misstate
  the claim, which is why the field is omitted rather than filled in.

  The guidance limits itself on its face: it states that it does not impose requirements
  beyond the LAD, establishes no rights or obligations, and will not be enforced by DCR as a
  substitute for enforcement of the LAD. Cite it as the regulator''s reading of the statute,
  never as the source of the duty. The statute is the source of the duty.

  The quote was taken by PDF text extraction, not from a human reading the document, so
  last_verified stays never. The sentence sits mid-page in Section II and does not span a page
  break, so header-stripping should not affect the match.

  Related and not yet registered: the DCR disparate-impact rulemaking that the guidance cites
  at 56 N.J.R. 969(a), and which the guidance describes as proposed rather than adopted as of
  January 2025. Secondary reporting says DCR has since adopted it. The adoption date and
  N.J.A.C. citation are unverified against the New Jersey Register, so nothing in the repo
  asserts them. See BACKLOG.md.

  See nj-lad-third-party-tool-no-defense for the vendor-liability half of this.'
