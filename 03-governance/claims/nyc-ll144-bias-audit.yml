# Regulatory claim record. See 03-governance/claims/README.md.
id: nyc-ll144-bias-audit
jurisdiction: US-NY-NYC
topic: Automated employment decision tools
statement: New York City employers and employment agencies may not use an automated employment
  decision tool unless it has had a bias audit within one year of use, the audit results are
  publicly available, and required notices have been given to employees or candidates.
status: in-force
effective: '2023-07-05'
primary_source:
  url: https://legistar.council.nyc.gov/LegislationDetail.aspx?GUID=B051915D-A9AC-451E-81F8-6596032FA3F9&ID=4344524
  citation: NYC Local Law 144 of 2021; NYC Admin Code 20-870 et seq.
  quote: 'In the city, it shall be unlawful for an employer or an employment agency to use
    an automated employment decision tool to screen a candidate or employee for an employment
    decision unless: 1. Such tool has been the subject of a bias audit conducted no more than
    one year prior to the use of such tool; and 2. A summary of the results of the most recent
    bias audit of such tool as well as the distribution date of the tool to which such audit
    applies has been made publicly available on the website of the employer or employment agency
    prior to the use of such tool.'
  retrieved: '2026-09-15'
asserted_in:
- 03-governance/README.md
- 03-governance/risk-assessment-template.md
last_verified: never
verified_by: unverified
review_interval_days: 180
