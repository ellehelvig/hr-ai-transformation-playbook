# Regulatory claim record. See 03-governance/claims/README.md.
id: eu-ai-act-penalties-operative
jurisdiction: EU
topic: EU AI Act penalties
statement: The Article 99 penalty provisions have applied since 2 August 2025, and Article 101,
  on fines for providers of general-purpose AI models, since 2 August 2026. For breaches of
  operator obligations such as Article 50, the Article 99 tier reaches EUR 15 million or 3% of
  worldwide annual turnover, whichever is higher, or whichever is lower for SMEs.
status: in-force
effective: '2025-08-02'
primary_source:
  url: https://publications.europa.eu/resource/celex/32024R1689
  citation: Regulation (EU) 2024/1689, Article 113, third paragraph, point (b) for the dates,
    and Article 99(4) and (6) for the tier
  quote: 'Chapter III Section 4, Chapter V, Chapter VII and Chapter XII and Article 78 shall
      apply from 2 August 2025, with the exception of Article 101'
  retrieved: '2026-09-22'
