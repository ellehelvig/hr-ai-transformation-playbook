name: Claude Code Review

# Reviews every pull request against CLAUDE.md, including the ones opened by the
# repo's own scheduled agents. This is the first gate on agent-proposed changes,
# so the maintainer spends attention on content rather than house rules.
#
# This repository is public. GitHub withholds secrets from workflow runs
# triggered by pull requests from forks, so this reviews same-repo branches
# only. Outside contributions still get reviewed by hand.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --max-turns 25
