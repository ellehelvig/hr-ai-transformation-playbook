[pytest]
; Each tool folder has its own file literally named tool.py (comp_banding/tool.py,
; resume_screen/tool.py, etc.) so that an SME can `cd` into one folder and run
; `pytest` with zero setup, per each folder's ENABLEMENT.md. That means running
; pytest from THIS directory (as CI does) hits the classic same-basename import
; collision under pytest's default "prepend" import mode. --import-mode=importlib
; gives every test file a unique fully-qualified module name instead, so both
; "pytest" from here and "cd comp_banding && pytest" from inside a folder work
; correctly. If you're debugging an import-related test failure, check this
; setting is still here before assuming the bug is in the tool code.
addopts = --import-mode=importlib
