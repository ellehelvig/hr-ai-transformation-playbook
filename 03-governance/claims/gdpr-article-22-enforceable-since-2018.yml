# Regulatory claim record. See 03-governance/claims/README.md.
id: gdpr-article-22-enforceable-since-2018
jurisdiction: EU
topic: GDPR automated decision-making
statement: GDPR Article 22 protections against solely automated decisions with legal or similarly
  significant effect have been enforceable since 25 May 2018.
status: in-force
effective: '2018-05-25'
primary_source:
  url: https://publications.europa.eu/resource/celex/32016R0679
  citation: Regulation (EU) 2016/679, Article 22(1) for the protection and Article 99(2) for
    the application date
  quote: The data subject shall have the right not to be subject to a decision based solely
    on automated processing, including profiling, which produces legal effects concerning him
    or her or similarly significantly affects him or her.
  retrieved: '2026-09-18'
asserted_in:
- 03-governance/deployer-checklist.md
- 03-governance/eu-ai-act-intake-template.md
last_verified: '2026-09-18'
verified_by: ellehelvig
review_interval_days: 365
notes: 'The quote is Article 22(1) in full. The date comes from Article 99(2), "It shall apply
  from 25 May 2018", which is why the citation names both. Only one can sit in the quote field,
  and the protection is the substance while the date is already carried by the effective field.

  Inference, not citation: the prose in deployer-checklist.md and eu-ai-act-intake-template.md
  adds that these protections run on their own timeline, independent of the AI Act. That is
  true, and it is the practically important point for a reader who thinks the December 2027
  high-risk date buys them time. But it is an observation about the relationship between two
  instruments, not something this source states, and it could not be: the GDPR predates the
  AI Act by years. It was removed from the statement field for that reason. Anyone re-verifying
  this record should check the two sourced elements, the protection and the date, and treat
  the AI Act comparison as reasoning the repo is responsible for rather than a citation.

  Article 22(3) is the other operationally important paragraph and is not registered
  separately: it requires, at minimum, the right to obtain human intervention, to express a
  point of view, and to contest the decision. The deployer checklist relies on it. Worth its
  own record.

  The url is the EU Publications Office copy of the Official Journal text. The same text is
  at https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679
  for reading in a browser, but EUR-Lex answers scripts with a bot challenge, so the weekly
  check cannot read it there.'
