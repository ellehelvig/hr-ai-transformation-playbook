schema_version: "1.1"
name: vendor-feature-on-by-default
expected_outcome: |
  A good result treats the release as an event trigger, adds the feature to the inventory with the owner marked UNRESOLVED, and routes it to the oversight path to pause or hold, to hr-ai-vendor-review, to fairness-audit-prep because it recommends people, and to the EU AI Act classifier and counsel for German staff. It asks once for missing inputs and proceeds with gaps labeled. It does not switch the feature off itself, rate any employee's readiness, or state a legal deadline from memory.
