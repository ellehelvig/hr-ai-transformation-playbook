name: Claim Source Check

# Fetches every primary source in the regulatory claims registry and asserts that each
# claim's verbatim quote still appears in it.
#
# This is deliberately not part of ci.yml. It depends on government websites being up and
# on their URLs not moving, so a failure here is information, not a reason to block a
# merge. It opens an issue instead.
#
# A failure means one of three things, and all three need a human:
#   - the source moved, so the URL needs updating
#   - the source changed, so the claim may now be wrong
#   - the quote was wrong to begin with
#
# GitHub disables scheduled workflows on a public repo after 60 days without repository
# activity.

on:
  schedule:
    - cron: "0 11 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        # pdfminer.six is needed because most US state legislatures publish
        # enacted acts as PDF only. Without it, every PDF-sourced claim reports
        # as unverifiable rather than being checked.
        run: pip install pyyaml pdfminer.six

      - name: Verify every claim against its primary source
        id: check
        run: |
          set +e
          python scripts/verify_claim_sources.py --online > result.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat result.txt

      - name: Publish the check summary
        if: always()
        run: |
          {
            echo '## Weekly claim source check'
            echo
            echo '```text'
            cat result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the review issue
        if: steps.check.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo 'A claim in the regulatory registry no longer matches its primary source.'
            echo
            echo 'Each failure below is one of: the source moved, the source changed, or the'
            echo 'quote was wrong. Open the source and read it before changing anything that'
            echo 'rests on the claim.'
            echo
            echo '```'
            cat result.txt
            echo '```'
          } > body.md
          issue_number="$(gh issue list \
            --state open \
            --label regulatory \
            --json number,title \
            --jq '[.[] | select(.title == "Weekly claim source check needs review" or (.title | startswith("Claim source check failed for ")))] | first | .number // empty')"

          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --title "Weekly claim source check needs review"
            gh issue comment "$issue_number" --body-file body.md
          else
            gh issue create \
              --title "Weekly claim source check needs review" \
              --label regulatory \
              --body-file body.md
          fi

      - name: Close a resolved review issue
        if: steps.check.outputs.exit == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          issue_number="$(gh issue list \
            --state open \
            --label regulatory \
            --json number,title \
            --jq '[.[] | select(.title == "Weekly claim source check needs review" or (.title | startswith("Claim source check failed for ")))] | first | .number // empty')"

          if [ -n "$issue_number" ]; then
            gh issue close "$issue_number" \
              --comment "The weekly primary-source check is passing again. Closing automatically."
          fi

      - name: Mark the scheduled check unsuccessful
        if: steps.check.outputs.exit != '0'
        run: exit 1
