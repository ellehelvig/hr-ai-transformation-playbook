notes: 'Corrected on 2026-09-22. The earlier statement said Articles 99 and 101 both became
  operative on 2 August 2026. Article 99 sits in Chapter XII, which Article 113(b) applies from
  2 August 2025; only Article 101 is excepted and falls to the general 2 August 2026 date.
  Regulation (EU) 2026/1744 amends points (a) and (c) of Article 113 and adds (d), but leaves
  (b) alone, so the 2025 date stands.

  The practical point in the prose survives the correction. Fines for an Article 50 breach,
  under Article 99(4)(g), could not arise before Article 50 itself applied on 2 August 2026, so
  that exposure is still live from that date. What changes is that the penalty regime was not
  new on that date.

  The url is the EU Publications Office copy of the Official Journal text. The same text is
  at https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32024R1689
  for reading in a browser, but EUR-Lex answers scripts with a bot challenge, so the weekly
  check cannot read it there.'
